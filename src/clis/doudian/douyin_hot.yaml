site: doudian
name: douyin_hot
description: 抖音热门榜单
domain: compass.jinritemai.com
strategy: cookie
browser: true
args:
  pageNo:
    type: int
    default: 1
    description: 页码
  pageSize:
    type: int
    default: 10
    description: 每页数量
  sortField:
    type: str
    default: "hot_value"
    description: 排序字段(hot_value=按热点指数)
  isAsc:
    type: bool
    default: false
    description: 是否升序(false=降序)
  hotLevel:
    type: int
    default: 0
    description: 热点等级(1=S级 2=A级 3=B级 0=全部)
  rankType:
    type: int
    default: 1
    description: 排行榜类型(固定=1)
  cateIds:
    type: str
    default: "0"
    description: 类目ID(0=全部)
  industryId:
    type: int
    default: 0
    description: 行业ID(0=全行业)
pipeline:
  - navigate: https://compass.jinritemai.com
  - evaluate: |
      (async () => {
        const params = new URLSearchParams({
          page_no: String(${{ args.pageNo | json }}),
          page_size: String(${{ args.pageSize | json }}),
          sort_field: String(${{ args.sortField | json }}),
          is_asc: String(${{ args.isAsc | json }}),
          hot_level: String(${{ args.hotLevel | json }}),
          rank_type: String(${{ args.rankType | json }}),
          cate_ids: String(${{ args.cateIds | json }}),
          industry_id: String(${{ args.industryId | json }})
        });

        const resp = await fetch('https://compass.jinritemai.com/compass_api/shop/mall/search_analysis/douyin_hotspot/rank_content_luopan?' + params.toString(), {
          method: 'GET',
          credentials: 'include'
        });
        return await resp.json();
      })()
columns:
  - raw
