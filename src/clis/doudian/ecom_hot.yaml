site: doudian
name: ecom_hot
description: 电商热搜词
domain: compass.jinritemai.com
strategy: cookie
browser: true
args:
  pageNo:
    type: int
    default: 1
    description: 页码
  pageSize:
    type: int
    default: 10
    description: 每页数量
  rankType:
    type: int
    default: 1
    description: 排行榜类型(1=热度高 2=增速快 3=竞争小 100=看后搜热词)
  searchIntent:
    type: int
    default: 0
    description: 搜索意图(0=全部 1=搜商品 2=搜内容 3=搜用户)
  dateType:
    type: int
    default: 21
    description: 日期类型(1=实时，20=近1天，21=近7天，23=近30天)
  beginDate:
    type: str
    default: ""
    description: 开始日期(YYYY/MM/DD HH:mm:ss, 默认上周)
  endDate:
    type: str
    default: ""
    description: 结束日期(YYYY/MM/DD HH:mm:ss, 默认上周)
  industryId:
    type: int
    default: 8
    description: 行业ID(8=生鲜)
  cateId:
    type: str
    required: true
    description: 类目ID(如水果=20188)
  indexSelected:
    type: str
    default: "search_show_ucnt,search_ucnt,pay_amt,product_show_ucnt,prod_show_click_ratio,prod_click_pay_ratio"
    description: 指标列表
pipeline:
  - navigate: https://compass.jinritemai.com
  - evaluate: |
      (async () => {
        const now = new Date();
        const lastWeekEnd = new Date(now);
        lastWeekEnd.setDate(now.getDate() - now.getDay() - 1);
        const lastWeekStart = new Date(lastWeekEnd);
        lastWeekStart.setDate(lastWeekEnd.getDate() - 6);

        const formatDate = (d) => {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return y + '/' + m + '/' + day + ' 00:00:00';
        };

        const argBeginDate = String(${{ args.beginDate | json }});
        const argEndDate = String(${{ args.endDate | json }});
        const beginDate = argBeginDate.length > 0 ? argBeginDate : formatDate(lastWeekStart);
        const endDate = argEndDate.length > 0 ? argEndDate : formatDate(lastWeekEnd);

        const cateId = String(${{ args.cateId | json }});
        const industryId = String(${{ args.industryId | json }});

        const params = new URLSearchParams({
          page_no: String(${{ args.pageNo | json }}),
          page_size: String(${{ args.pageSize | json }}),
          rank_type: String(${{ args.rankType | json }}),
          search_intent: String(${{ args.searchIntent | json }}),
          sort_field: '',
          is_asc: 'false',
          date_type: String(${{ args.dateType | json }}),
          end_date: endDate,
          begin_date: beginDate,
          activity_id: '',
          is_activity: 'false',
          industry_id: industryId,
          cate_id: cateId,
          category_id: cateId,
          total_cate_id: '38944,' + cateId,
          index_selected: String(${{ args.indexSelected | json }})
        });

        const resp = await fetch('https://compass.jinritemai.com/compass_api/shop/mall/search_analysis/industry_words/compass_rank_v3?' + params.toString(), {
          method: 'GET',
          credentials: 'include'
        });
        return await resp.json();
      })()
columns:
  - raw
